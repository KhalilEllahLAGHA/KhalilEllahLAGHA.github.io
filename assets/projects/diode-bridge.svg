<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 396" width="760" height="396" role="img" aria-labelledby="title desc">
<title id="title">Three-phase diode bridge</title>
<desc id="desc">Three AC lines feed the midpoints of three diode pairs. The six diodes rectify the line-to-line voltage across a resistive DC load.</desc>
