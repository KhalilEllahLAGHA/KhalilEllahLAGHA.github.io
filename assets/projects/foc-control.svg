<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 760" role="img" aria-labelledby="title desc">
  <title id="title">Indirect field-oriented control architecture of the induction motor</title>
  <desc id="desc">The speed PI produces a torque request converted to the q-axis current reference; a flux reference sets the d-axis current reference. Two current PIs with feed-forward decoupling generate d/q voltage references. Inverse Park, SVPWM gate commands and the inverter feed the induction motor. Phase-current feedback passes through Clarke and Park. A current-model rotor-flux estimate, measured rotor speed and slip integration give the orientation angle used by both transforms. No Kalman filter is used. This is the switching-inverter view; average-value inverter variants are also implemented.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101a31"/><stop offset="1" stop-color="#0b1123"/></linearGradient>
    <marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" viewBox="0 0 10 10" refX="10" refY="5" orient="auto"><path d="M0 0L10 5 0 10Z" fill="#fbbf24"/></marker>
    <marker id="feedback" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" viewBox="0 0 10 10" refX="10" refY="5" orient="auto"><path d="M0 0L10 5 0 10Z" fill="#66c5d8"/></marker>
    <marker id="angle" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" viewBox="0 0 10 10" refX="10" refY="5" orient="auto"><path d="M0 0L10 5 0 10Z" fill="#c4b5fd"/></marker>
  </defs>
  <rect width="1100" height="760" rx="24" fill="url(#bg)"/>
  <g stroke="#33405f" opacity=".18" fill="none"><path d="M0 160H1100M0 360H1100M0 560H1100M200 0V760M400 0V760M600 0V760M800 0V760M1000 0V760"/></g>
  <g font-family="Segoe UI,Arial,sans-serif">
    <text x="35" y="45" fill="#fbbf24" font-weight="700" font-size="18" letter-spacing="3">VECTOR CONTROL</text>
    <text x="35" y="84" fill="#f4f6fb" font-weight="700" font-size="30">Indirect rotor-flux-oriented control</text>
    <text x="35" y="115" fill="#a9b7d0" font-size="18">Flux-oriented axes separate flux and torque; feed-forward compensates their coupling.</text>
  </g>
  <g font-family="Segoe UI,Arial,sans-serif" text-anchor="middle">
    <rect x="35" y="240" width="130" height="112" rx="12" fill="#152445" stroke="#fbbf24" stroke-width="2"/>
    <text x="100" y="282" fill="#edf3ff" font-size="24" font-weight="700">Speed PI</text><text x="100" y="316" fill="#a9b7d0" font-size="17">torque request</text>
    <rect x="215" y="240" width="165" height="112" rx="12" fill="#152445" stroke="#fbbf24" stroke-width="2"/>
    <text x="297" y="275" fill="#edf3ff" font-size="24" font-weight="700">Current PIs</text><text x="297" y="304" fill="#fbbf24" font-size="23">d / q</text><text x="297" y="331" fill="#a9b7d0" font-size="16">+ feed-forward</text>
    <rect x="430" y="240" width="135" height="112" rx="12" fill="#152445" stroke="#fbbf24" stroke-width="2"/>
    <text x="497" y="282" fill="#edf3ff" font-size="23" font-weight="700">Inverse</text><text x="497" y="315" fill="#edf3ff" font-size="23" font-weight="700">Park</text>
    <rect x="615" y="240" width="120" height="112" rx="12" fill="#152445" stroke="#fbbf24" stroke-width="2"/>
    <text x="675" y="282" fill="#edf3ff" font-size="23" font-weight="700">SVPWM</text><text x="675" y="316" fill="#a9b7d0" font-size="16">modulation</text>
    <rect x="785" y="240" width="120" height="112" rx="12" fill="#152445" stroke="#fbbf24" stroke-width="2"/>
    <text x="845" y="282" fill="#edf3ff" font-size="23" font-weight="700">Inverter</text><text x="845" y="316" fill="#a9b7d0" font-size="16">power stage</text>
    <rect x="955" y="240" width="120" height="112" rx="12" fill="#152445" stroke="#66c5d8" stroke-width="2"/>
    <text x="1015" y="274" fill="#edf3ff" font-size="21" font-weight="700">Induction</text><text x="1015" y="303" fill="#edf3ff" font-size="23" font-weight="700">motor</text><text x="1015" y="332" fill="#66c5d8" font-size="17">5 kW</text>
    <rect x="215" y="150" width="165" height="61" rx="10" fill="#132942" stroke="#66c5d8"/>
    <text x="297" y="176" fill="#edf3ff" font-size="21" font-weight="700">Flux target</text><text x="297" y="199" fill="#66c5d8" font-size="17">d-axis reference</text>
    <rect x="705" y="450" width="190" height="100" rx="12" fill="#132942" stroke="#66c5d8" stroke-width="2"/>
    <text x="800" y="486" fill="#edf3ff" font-size="24" font-weight="700">Clarke / Park</text><text x="800" y="521" fill="#66c5d8" font-size="18">phase currents → d/q</text>
    <rect x="420" y="585" width="280" height="95" rx="12" fill="#22243e" stroke="#c4b5fd" stroke-width="2"/>
    <text x="560" y="616" fill="#edf3ff" font-size="24" font-weight="700">Flux orientation</text><text x="560" y="644" fill="#c4b5fd" font-size="20">current model + slip</text><text x="560" y="667" fill="#a9b7d0" font-size="16">from d/q currents + rotor speed</text>
  </g>
  <g fill="none" stroke="#fbbf24" stroke-width="2.6" marker-end="url(#arrow)">
    <path d="M100 212V240"/><path d="M165 296H215"/><path d="M297 211V240"/><path d="M380 296H430"/><path d="M565 296H615"/><path d="M735 296H785"/><path d="M905 296H955"/>
  </g>
  <g font-family="Segoe UI,Arial,sans-serif" font-size="17" text-anchor="middle">
    <text x="100" y="199" fill="#cad3e5">speed target</text><text x="190" y="227" fill="#fbbf24">iᑫ*</text><text x="405" y="227" fill="#fbbf24">vᵈ*, vᑫ*</text><text x="590" y="204" fill="#cad3e5">voltage</text><text x="590" y="225" fill="#cad3e5">reference</text><text x="760" y="225" fill="#cad3e5">gate pulses</text><text x="930" y="225" fill="#cad3e5">3-phase</text>
  </g>
  <g fill="none" stroke="#66c5d8" stroke-width="2.3" marker-end="url(#feedback)">
    <path d="M990 352V500H895"/>
    <path d="M705 500H297V352"/>
    <path d="M650 500V560H740V610H700"/>
    <path d="M1040 352V720H100V352"/>
    <path d="M800 720V650H700"/>
  </g>
  <circle cx="650" cy="500" r="4" fill="#66c5d8"/><circle cx="800" cy="720" r="4" fill="#66c5d8"/>
  <g font-family="Segoe UI,Arial,sans-serif" fill="#66c5d8" font-size="18">
    <text x="870" y="422">phase currents</text><text x="341" y="482">d/q feedback</text><text x="260" y="706">measured rotor speed</text>
  </g>
  <g fill="none" stroke="#101a31" stroke-width="10"><path d="M550 585V400H497V352"/><path d="M550 400H800V450"/></g>
  <g fill="none" stroke="#c4b5fd" stroke-width="2.3" stroke-dasharray="7 5" marker-end="url(#angle)"><path d="M550 585V400H497V352"/><path d="M550 400H800V450"/></g>
  <circle cx="550" cy="400" r="4" fill="#c4b5fd"/>
  <text x="610" y="386" fill="#c4b5fd" font-family="Segoe UI,Arial,sans-serif" font-size="18">orientation angle</text>
  <text x="35" y="747" fill="#a9b7d0" font-family="Segoe UI,Arial,sans-serif" font-size="15">Switching-inverter view · average-value inverter variants are also implemented.</text>
</svg>
