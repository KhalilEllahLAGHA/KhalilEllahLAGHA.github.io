<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 396" width="760" height="396" role="img" aria-labelledby="title desc">
<title id="title">IEEE 14-bus topology</title>
<desc id="desc">14 buses and all 20 branches of system14bus.m. Colours distinguish the slack bus, voltage-controlled PV buses and PQ buses. The geometry does not represent geographical distance.</desc>
<defs>
<marker id="wire" viewBox="0 0 9 9" markerWidth="8" markerHeight="8" refX="8.3" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
<path d="M0 0 9 4.5 0 9Z" fill="#1b6160"/>
</marker>
<marker id="fb" viewBox="0 0 9 9" markerWidth="8" markerHeight="8" refX="8.3" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
<path d="M0 0 9 4.5 0 9Z" fill="#a34726"/>
</marker>
<marker id="neutral" viewBox="0 0 9 9" markerWidth="8" markerHeight="8" refX="8.3" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
<path d="M0 0 9 4.5 0 9Z" fill="#486c70"/>
</marker>
<pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
<circle cx="1" cy="1" r="1" fill="#c0d1cb"/>
</pattern>
</defs>
<style> text{font-family:Segoe UI,Arial,sans-serif} .ink{fill:#143d41}.muted{fill:#486c70}.warm{fill:#1b6160}.cool{fill:#a34726}.wire{stroke:#1b6160}.fb{stroke:#a34726}.neutral{stroke:#486c70}.box{fill:#f9fcf8;stroke-width:1.8}.line{fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}.pulse{fill:none;stroke:#143d41;stroke-width:3;stroke-dasharray:3 40;stroke-linecap:round;opacity:0}@media(prefers-reduced-motion:no-preference){.pulse{animation:signal 2s linear 2}@keyframes signal{0%{stroke-dashoffset:86;opacity:0}12%,82%{opacity:.85}100%{stroke-dashoffset:0;opacity:0}}}</style>
