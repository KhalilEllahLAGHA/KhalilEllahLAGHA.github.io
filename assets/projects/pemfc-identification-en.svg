<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 396" width="760" height="396" role="img" aria-labelledby="title desc">
<title id="title">PEMFC identification</title>
<desc id="desc">Voltages from ten cells were recorded. Cells 3 to 9 were used for fitting the empirical model. Fit and test use 269 and 116 consecutive samples respectively from the same experiment.</desc>
<defs>
<marker id="wire" viewBox="0 0 9 9" markerWidth="8" markerHeight="8" refX="8.3" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
<path d="M0 0 9 4.5 0 9Z" fill="#f5bf66"/>
</marker>
<marker id="fb" viewBox="0 0 9 9" markerWidth="8" markerHeight="8" refX="8.3" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
<path d="M0 0 9 4.5 0 9Z" fill="#77d8d5"/>
</marker>
<marker id="neutral" viewBox="0 0 9 9" markerWidth="8" markerHeight="8" refX="8.3" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
<path d="M0 0 9 4.5 0 9Z" fill="#acbed1"/>
</marker>
<pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
<circle cx="1" cy="1" r="1" fill="#334459"/>
</pattern>
</defs>
<style> text{font-family:Segoe UI,Arial,sans-serif} .ink{fill:#f6f5ed}.muted{fill:#acbed1}.warm{fill:#f5bf66}.cool{fill:#77d8d5}.wire{stroke:#f5bf66}.fb{stroke:#77d8d5}.neutral{stroke:#acbed1}.box{fill:#162a41;stroke-width:1.8}.line{fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}.pulse{fill:none;stroke:#f6f5ed;stroke-width:3;stroke-dasharray:3 40;stroke-linecap:round;opacity:0}@media(prefers-reduced-motion:no-preference){.pulse{animation:signal 2s linear 2}@keyframes signal{0%{stroke-dashoffset:86;opacity:0}12%,82%{opacity:.85}100%{stroke-dashoffset:0;opacity:0}}}</style>
<rect width="760" height="396" fill="#101e32"/>
<rect width="760" height="396" fill="url(#grid)"/>
<path d="M63 148l13 -12v67l-13 12Z" fill="#243b48" stroke="#89c3bf" stroke-width="1.5"/>
<path d="M69 148l13 -12v67l-13 12Z" fill="#243b48" stroke="#89c3bf" stroke-width="1.5"/>
<path d="M75 148l13 -12v67l-13 12Z" fill="#325865" stroke="#89c3bf" stroke-width="1.5"/>
<path d="M81 148l13 -12v67l-13 12Z" fill="#325865" stroke="#89c3bf" stroke-width="1.5"/>
<path d="M87 148l13 -12v67l-13 12Z" fill="#325865" stroke="#89c3bf" stroke-width="1.5"/>
<path d="M93 148l13 -12v67l-13 12Z" fill="#325865" stroke="#89c3bf" stroke-width="1.5"/>
<path d="M99 148l13 -12v67l-13 12Z" fill="#325865" stroke="#89c3bf" stroke-width="1.5"/>
<path d="M105 148l13 -12v67l-13 12Z" fill="#325865" stroke="#89c3bf" stroke-width="1.5"/>
<path d="M111 148l13 -12v67l-13 12Z" fill="#325865" stroke="#89c3bf" stroke-width="1.5"/>
<path d="M117 148l13 -12v67l-13 12Z" fill="#243b48" stroke="#89c3bf" stroke-width="1.5"/>
<text x="95" y="260" class="ink" font-size="21" font-weight="500" text-anchor="middle">10 cells</text>
<path d="M157 176H220" class="line wire" marker-end="url(#wire)"/>
<path d="M157 176H220" class="pulse"/>
<rect x="220" y="134" width="145" height="85" rx="5" class="box wire"/>
<text x="292.5" y="176.5" class="ink" font-size="26" font-weight="650" text-anchor="middle">U₃ … U₉</text>
<text x="292.5" y="203.5" class="muted" font-size="19" font-weight="500" text-anchor="middle">7 cells</text>
<path d="M365 176H422" class="line wire" marker-end="url(#wire)"/>
<path d="M365 176H422" class="pulse"/>
<rect x="422" y="134" width="214" height="85" rx="5" class="box wire"/>
<text x="529.0" y="176.5" class="ink" font-size="26" font-weight="650" text-anchor="middle">Û(I)</text>
<text x="529.0" y="203.5" class="muted" font-size="19" font-weight="500" text-anchor="middle">2 coefficients</text>
<text x="380" y="71" class="ink" font-size="27" font-weight="650" text-anchor="middle">Per-cell identification</text>
<path d="M525 219V260" class="line fb" marker-end="url(#fb)"/>
<text x="378" y="294" class="warm" font-size="28" font-weight="650" text-anchor="middle">269</text>
<text x="569" y="294" class="cool" font-size="28" font-weight="650" text-anchor="middle">116</text>
<rect x="239" y="308" width="274" height="7" rx="3" class="warm"/>
<rect x="517" y="308" width="118" height="7" rx="3" class="cool"/>
<text x="378" y="347" class="muted" font-size="19" font-weight="500" text-anchor="middle">fit</text>
<text x="569" y="347" class="muted" font-size="19" font-weight="500" text-anchor="middle">test</text>
</svg>