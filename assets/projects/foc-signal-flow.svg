<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 396" width="760" height="396" role="img" aria-labelledby="title desc">
<title id="title">Indirect field-oriented control</title>
<desc id="desc">Speed and flux references set q- and d-axis current targets. The decoupled current controllers drive inverse Park, SVPWM and the inverter. Motor speed and transformed phase currents close the loops. The orientation angle is supplied to both transforms.</desc>
<defs>
<marker id="wire" viewBox="0 0 9 9" markerWidth="8" markerHeight="8" refX="8.3" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
<path d="M0 0 9 4.5 0 9Z" fill="#f5bf66"/>
</marker>
<marker id="fb" viewBox="0 0 9 9" markerWidth="8" markerHeight="8" refX="8.3" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
<path d="M0 0 9 4.5 0 9Z" fill="#77d8d5"/>
</marker>
<marker id="neutral" viewBox="0 0 9 9" markerWidth="8" markerHeight="8" refX="8.3" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
<path d="M0 0 9 4.5 0 9Z" fill="#acbed1"/>
</marker>
<pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
<circle cx="1" cy="1" r="1" fill="#334459"/>
</pattern>
</defs>
<style> text{font-family:Segoe UI,Arial,sans-serif} .ink{fill:#f6f5ed}.muted{fill:#acbed1}.warm{fill:#f5bf66}.cool{fill:#77d8d5}.wire{stroke:#f5bf66}.fb{stroke:#77d8d5}.neutral{stroke:#acbed1}.box{fill:#162a41;stroke-width:1.8}.line{fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}.pulse{fill:none;stroke:#f6f5ed;stroke-width:3;stroke-dasharray:3 40;stroke-linecap:round;opacity:0}@media(prefers-reduced-motion:no-preference){.pulse{animation:signal 2s linear 2}@keyframes signal{0%{stroke-dashoffset:86;opacity:0}12%,82%{opacity:.85}100%{stroke-dashoffset:0;opacity:0}}}</style>
<rect width="760" height="396" fill="#101e32"/>
<rect width="760" height="396" fill="url(#grid)"/>
<text x="24" y="137" class="warm" font-size="20" font-weight="500" text-anchor="start">ω*</text>
<path d="M24 150H78" class="line wire" marker-end="url(#wire)"/>
<rect x="78" y="112" width="124" height="78" rx="5" class="box wire"/>
<text x="140.0" y="151.0" class="ink" font-size="26" font-weight="650" text-anchor="middle">PI ω</text>
<text x="140.0" y="178.0" class="muted" font-size="19" font-weight="500" text-anchor="middle">T* → i<tspan baseline-shift="sub" font-size="72%">q</tspan>*</text>
<path d="M202 150H254" class="line wire" marker-end="url(#wire)"/>
<path d="M202 150H254" class="pulse"/>
<rect x="254" y="112" width="142" height="78" rx="5" class="box wire"/>
<text x="325.0" y="151.0" class="ink" font-size="26" font-weight="650" text-anchor="middle">PI d,q</text>
<text x="325.0" y="178.0" class="muted" font-size="19" font-weight="500" text-anchor="middle">+ FF</text>
<text x="325" y="48" class="warm" font-size="22" font-weight="500" text-anchor="middle">ψᵣ* → i<tspan baseline-shift="sub" font-size="72%">d</tspan>*</text>
<path d="M325 61V112" class="line wire" marker-end="url(#wire)"/>
<path d="M396 150H452" class="line wire" marker-end="url(#wire)"/>
<path d="M396 150H452" class="pulse"/>
<text x="424" y="133" class="muted" font-size="16" font-weight="500" text-anchor="middle">v*<tspan baseline-shift="sub" font-size="72%">dq</tspan>
</text>
<rect x="452" y="112" width="134" height="78" rx="5" class="box wire"/>
<text x="519.0" y="151.0" class="ink" font-size="26" font-weight="650" text-anchor="middle">Park⁻¹</text>
<text x="519.0" y="178.0" class="muted" font-size="19" font-weight="500" text-anchor="middle">SVPWM</text>
<text x="519" y="48" class="cool" font-size="23" font-weight="500" text-anchor="middle">θₑ</text>
<path d="M519 61V112" class="line fb" marker-end="url(#fb)"/>
<path d="M586 150H630" class="line wire" marker-end="url(#wire)"/>
<path d="M586 150H630" class="pulse"/>
<rect x="630" y="112" width="94" height="78" rx="5" class="box wire"/>
<text x="677.0" y="151.0" class="ink" font-size="26" font-weight="650" text-anchor="middle">DC/AC</text>
<text x="677.0" y="178.0" class="muted" font-size="19" font-weight="500" text-anchor="middle">3 ~</text>
<path d="M677 190V231" class="line wire" marker-end="url(#wire)"/>
<path d="M677 190V231" class="pulse"/>
<circle cx="677" cy="271" r="40" class="box fb"/>
<text x="677" y="278" class="ink" font-size="32" font-weight="650" text-anchor="middle">M</text>
<path d="M637 266H476" class="line fb" marker-end="url(#fb)"/>
<path d="M637 266H476" class="pulse"/>
<text x="556" y="252" class="cool" font-size="19" font-weight="500" text-anchor="middle">i<tspan baseline-shift="sub" font-size="72%">a</tspan>, i<tspan baseline-shift="sub" font-size="72%">b</tspan>, i<tspan baseline-shift="sub" font-size="72%">c</tspan>
</text>
<rect x="330" y="232" width="146" height="67" rx="5" class="box fb"/>
<text x="403.0" y="273.5" class="ink" font-size="26" font-weight="650" text-anchor="middle">abc → dq</text>
<text x="404" y="339" class="cool" font-size="20" font-weight="500" text-anchor="middle">θₑ</text>
<path d="M404 315V299" class="line fb" marker-end="url(#fb)"/>
<path d="M330 266H282V190" class="line fb" marker-end="url(#fb)"/>
<path d="M330 266H282V190" class="pulse"/>
<text x="267" y="238" class="cool" font-size="18" font-weight="500" text-anchor="end">i<tspan baseline-shift="sub" font-size="72%">d</tspan>, i<tspan baseline-shift="sub" font-size="72%">q</tspan>
</text>
<path d="M677 311V359H140V190" class="line fb" marker-end="url(#fb)"/>
<path d="M677 311V359H140V190" class="pulse"/>
<text x="218" y="346" class="cool" font-size="22" font-weight="500" text-anchor="middle">ωₘ</text>
<text x="126" y="212" class="cool" font-size="16" font-weight="500" text-anchor="middle">−</text>
<text x="296" y="212" class="cool" font-size="16" font-weight="500" text-anchor="middle">−</text>
</svg>